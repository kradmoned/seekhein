
[project]
name = "seekhein"
version = "0.1.0"
description = "Socratic AI Programming Lab Assistant"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.60.0",
    "python-dotenv>=1.2.4",
    "chromadb>=1.5.9",
    "pymupdf>=2.2",
    "sentence-transformers>=6.3.0",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
